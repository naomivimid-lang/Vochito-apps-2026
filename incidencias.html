<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Incidencias - Vochito Envíos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/estilos.css" />
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-white d-flex align-items-center gap-2" href="inicio.html">
                <img src="img/logo.png" alt="Logo" width="60" height="60" class="rounded-circle d-inline-block align-text-top" />
                <div class="d-flex flex-column lh-sm">
                    <span><i class="fa-solid fa-leaf"></i> Bochito</span>
                    <small>Comercio local</small>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="inicio.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html"><i class="fa-solid fa-box"></i> Productos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="incidencias.html"><i class="fa-solid fa-triangle-exclamation"></i> Incidencias</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-primary text-white text-center py-5">
        <div class="container py-3">
            <h1 class="display-4 fw-bold">Registro de Incidencias</h1>
            <p class="lead">Reporta cualquier problema con tus pedidos o entregas.</p>
        </div>
    </header>

    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-4">
                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label for="idPedido" class="form-label fw-bold">ID del Pedido <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="idPedido" placeholder="Ej. PED-12345" required>
                        </div>
                        <div class="mb-3">
                            <label for="tipoIncidencia" class="form-label fw-bold">Tipo de Incidencia <span class="text-danger">*</span></label>
                            <select class="form-select" id="tipoIncidencia" required>
                                <option value="">Selecciona una opción</option>
                                <option value="retraso">Retraso en la entrega</option>
                                <option value="dano">Producto dañado</option>
                                <option value="extravio">Paquete extraviado</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label fw-bold">Descripción detallada <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="descripcion" rows="4" placeholder="Describe el problema..." required></textarea>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary px-4">Registrar Incidencia</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-custom-dark text-white text-center py-3 mt-auto">
        <div class="container"><p class="mb-0 small">&copy; 2026 Raíces Digitales - Vochito Envíos y Ventas.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
