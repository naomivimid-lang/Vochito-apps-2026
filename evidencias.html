<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evidencias de Entrega - Vochito Envíos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/estilos.css" />
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-white d-flex align-items-center gap-2" href="inicio.html">
                <img src="img/logo.png" alt="Logo" width="60" height="60" class="rounded-circle d-inline-block align-text-top" />
                <div class="d-flex flex-column lh-sm">
                    <span><i class="fa-solid fa-leaf"></i> Bochito</span>
                    <small>Comercio local</small>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="inicio.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="evidencias.html"><i class="fa-solid fa-camera"></i> Evidencias</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-primary text-white text-center py-5">
        <div class="container py-3">
            <h1 class="display-4 fw-bold">Evidencia de Entrega</h1>
            <p class="lead">Sube fotografías o comprobantes de tus entregas realizadas.</p>
        </div>
    </header>

    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <form action="#" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="idPedidoEvidencia" class="form-label fw-bold">ID del Pedido <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="idPedidoEvidencia" placeholder="Ej. PED-1029" required>
                        </div>
                        <div class="mb-3">
                            <label for="fotoEntrega" class="form-label fw-bold">Fotografía del paquete entregado <span class="text-danger">*</span></label>
                            <input class="form-control" type="file" id="fotoEntrega" accept="image/*" required>
                        </div>
                        <div class="mb-3">
                            <label for="comentarios" class="form-label fw-bold">Comentarios adicionales</label>
                            <textarea class="form-control" id="comentarios" rows="3" placeholder="Persona que recibió, referencias, etc."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mt-3"><i class="fa-solid fa-cloud-arrow-up"></i> Subir Evidencia</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-custom-dark text-white text-center py-3 mt-auto">
        <div class="container"><p class="mb-0 small">&copy; 2026 Raíces Digitales.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
